name: Build OpenWrt Package

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'rtp2httpd/**'
      - 'luci-app-rtp2httpd/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'rtp2httpd/**'
      - 'luci-app-rtp2httpd/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a7_vfpv4
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4
          - mips_24kc
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - riscv64_riscv64

        sdk:
          - "24.10.4" # For IPK
          - "SNAPSHOT" # For APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          NO_SHFMT_CHECK: true
          PACKAGES: rtp2httpd luci-app-rtp2httpd
          V: sc

      - name: Prepare Artifacts
        run: |
          mkdir -p bin/artifacts
          
          # Copy IPK files
          if ls bin/packages/${{ matrix.arch }}/action/*.ipk 1> /dev/null 2>&1; then
            cp bin/packages/${{ matrix.arch }}/action/*.ipk bin/artifacts/
          fi

          # Rename and Copy APK files
          if ls bin/packages/${{ matrix.arch }}/action/*.apk 1> /dev/null 2>&1; then
            for apk_file in bin/packages/${{ matrix.arch }}/action/*.apk; do
              filename=$(basename "$apk_file")
              if [[ "$filename" == luci-* ]]; then
                 cp "$apk_file" "bin/artifacts/$filename"
              else
                 new_filename="${filename%.apk}_${{ matrix.arch }}.apk"
                 cp "$apk_file" "bin/artifacts/$new_filename"
              fi
            done
          fi

          # Create tar.gz archive
          cd bin/artifacts
          TAR_NAME="rtp2httpd-${{ matrix.arch }}-${{ matrix.sdk }}.tar.gz"
          tar -czvf "$TAR_NAME" *
          
          # Clean up everything except the tarball
          mkdir -p ../upload
          mv "$TAR_NAME" ../upload/
          cd ..
          rm -rf artifacts
          mv upload artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}-${{ matrix.sdk }}
          path: bin/artifacts/*
          if-no-files-found: ignore

