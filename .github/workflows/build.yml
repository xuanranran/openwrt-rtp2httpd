name: Build OpenWrt Package

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'rtp2httpd/**'
      - 'luci-app-rtp2httpd/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'rtp2httpd/**'
      - 'luci-app-rtp2httpd/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a7_vfpv4
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4
          - mips_24kc
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - riscv64_riscv64

        sdk:
          - "24.10.4" # For IPK
          - "SNAPSHOT" # For APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          NO_SHFMT_CHECK: true
          PACKAGES: rtp2httpd luci-app-rtp2httpd
          V: sc

      - name: Prepare Artifacts
        run: |
          mkdir -p bin/artifacts
          
          echo "Finding packages..."
          # Use find to locate packages, handling potential path variations
          find bin/packages/ -type f -name "*.ipk" -exec cp {} bin/artifacts/ \; 2>/dev/null || true
          find bin/packages/ -type f -name "*.apk" -exec cp {} bin/artifacts/ \; 2>/dev/null || true
          
          # Rename apk files if needed (append arch)
          cd bin/artifacts
          if ls *.apk 1> /dev/null 2>&1; then
            for apk_file in *.apk; do
              filename=$(basename "$apk_file")
              # Skip already renamed or luci files (luci files are usually 'all' arch)
              if [[ "$filename" == luci-* ]] || [[ "$filename" == *_${{ matrix.arch }}.apk ]]; then
                 continue
              fi
              
              # Append arch to filename
              new_filename="${filename%.apk}_${{ matrix.arch }}.apk"
              mv "$apk_file" "$new_filename"
            done
          fi
          
          # Check if we have any files to compress
          if [ -z "$(ls -A .)" ]; then
             echo "::error::No packages found in bin/packages/! Listing bin directory for debug:"
             cd ../..
             ls -R bin/
             exit 1
          fi

          # Create tar.gz archive
          TAR_NAME="rtp2httpd-${{ matrix.arch }}-${{ matrix.sdk }}.tar.gz"
          tar -czvf "$TAR_NAME" *
          
          # Clean up
          mkdir -p ../../upload
          mv "$TAR_NAME" ../../upload/
          cd ../..
          rm -rf bin/artifacts
          mkdir -p bin/artifacts
          mv upload/* bin/artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}-${{ matrix.sdk }}
          path: bin/artifacts/*
          if-no-files-found: ignore

      - name: Get Version
        id: version
        run: |
          VERSION=$(grep '^PKG_VERSION:=' rtp2httpd/Makefile | cut -d= -f2)
          echo "PKG_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') == false && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          tag_name: "v${{ steps.version.outputs.PKG_VERSION }}"
          name: "v${{ steps.version.outputs.PKG_VERSION }}"
          body: |
            rtp2httpd OpenWrt Packages
            
            Version: ${{ steps.version.outputs.PKG_VERSION }}
          files: bin/artifacts/*.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}

