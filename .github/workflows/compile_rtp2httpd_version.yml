name: "Compile The New rtp2httpd version"

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if version matches'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for Updates
        id: check
        run: |
          # Upstream Repo (Release source)
          API_URL="https://api.github.com/repos/stackia/rtp2httpd/releases/latest"
          
          # Get latest version tag (e.g., v3.5.2)
          LATEST_TAG=$(curl -s "$API_URL" | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          
          if [ -z "$LATEST_TAG" ]; then
            echo "Failed to find latest release tag."
            exit 1
          fi
          
          # Clean version string (remove 'v' prefix if present)
          NEW_VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
          
          echo "Latest Version: $NEW_VERSION"
          
          # Get current PKG_VERSION from Makefile
          CURRENT_VERSION=$(grep '^PKG_VERSION:=' rtp2httpd/Makefile | cut -d= -f2)
          
          echo "Current Version: $CURRENT_VERSION"
          
          FORCE="${{ github.event.inputs.force_update }}"
          
          UPDATE_NEEDED="false"
          NEW_HASH=""
          
          if [ "$NEW_VERSION" != "$CURRENT_VERSION" ]; then
             echo "Version Update found!"
             UPDATE_NEEDED="true"
          elif [ "$FORCE" == "true" ]; then
             echo "Forced Update!"
             UPDATE_NEEDED="true"
          else
             # Version matches, check Hash
             echo "Version matches. Checking Hash..."
             
             DOWNLOAD_URL="https://codeload.github.com/stackia/rtp2httpd/tar.gz/v$NEW_VERSION"
             curl -sL "$DOWNLOAD_URL" -o source_check.tar.gz
             NEW_HASH_CALC=$(sha256sum source_check.tar.gz | cut -d' ' -f1)
             rm source_check.tar.gz
             
             CURRENT_HASH=$(grep '^PKG_HASH:=' rtp2httpd/Makefile | cut -d= -f2)
             
             if [ "$NEW_HASH_CALC" != "$CURRENT_HASH" ]; then
                echo "Hash Mismatch! Update needed."
                echo "Old Hash: $CURRENT_HASH"
                echo "New Hash: $NEW_HASH_CALC"
                UPDATE_NEEDED="true"
                NEW_HASH="$NEW_HASH_CALC"
             else
                echo "Hash matches. No update needed."
             fi
          fi
          
          if [ "$UPDATE_NEEDED" == "true" ]; then
             echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
             echo "update_needed=true" >> $GITHUB_OUTPUT
             if [ -n "$NEW_HASH" ]; then
                echo "new_hash=$NEW_HASH" >> $GITHUB_OUTPUT
             fi
          else
             echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Makefile
        if: steps.check.outputs.update_needed == 'true'
        run: |
          NEW_VER="${{ steps.check.outputs.new_version }}"
          PRECALC_HASH="${{ steps.check.outputs.new_hash }}"
          
          echo "Updating Makefile to $NEW_VER..."
          
          # Download new source to calculate hash if not already done
          if [ -z "$PRECALC_HASH" ]; then
             DOWNLOAD_URL="https://codeload.github.com/stackia/rtp2httpd/tar.gz/v$NEW_VER"
             echo "Downloading from $DOWNLOAD_URL"
             curl -sL "$DOWNLOAD_URL" -o source.tar.gz
             
             # Calculate SHA256 Hash
             NEW_HASH=$(sha256sum source.tar.gz | cut -d' ' -f1)
             rm source.tar.gz
          else
             NEW_HASH="$PRECALC_HASH"
          fi
          
          echo "New Hash: $NEW_HASH"
          
          if [ -z "$NEW_HASH" ]; then
             echo "Failed to calculate hash."
             exit 1
          fi

          # Update PKG_VERSION
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$NEW_VER/" rtp2httpd/Makefile
          
          # Reset PKG_RELEASE to 1
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" rtp2httpd/Makefile
          
          # Update PKG_HASH
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=$NEW_HASH/" rtp2httpd/Makefile

      - name: Commit and Push
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Add potentially modified files
          git add rtp2httpd/Makefile
          
          # Commit and Push
          git commit -m "rtp2httpd: update to ${{ steps.check.outputs.new_version }}"
          git push origin HEAD:${{ github.ref }}

      - name: Trigger Build
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml
